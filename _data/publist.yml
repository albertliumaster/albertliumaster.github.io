- title: "Nonlocal Coherent Optical Nonlinearities of a Macroscopic Quantum System"
  image: 2025_PRLGraphic.png
  description: Locality is a standard assumption for light-matter interactions, and experimental realizations of nonlocal optical responses largely derive from classical transport processes. Here, we used two-dimensional optical spectroscopy to study quantum-confined exciton-polaritons in a semiconductor microcavity and observed nonlinear optical responses that are both nonlocal and coherent. This nonlocal response has a distinct quantum origin and derives from coupling between confined exciton-polariton wavefunctions that exist in different regions of space.
  authors: A Liu, EW Martin, J Hu, Z Wang, H Deng, and ST Cundiff
  link:
    url: https://doi.org/10.1103/jrds-3tyk
    display: Physical Review Letters 135, 183801 (2025) - [pdf](/downloads/Liu_PRL_2025.pdf)
  highlight: 1
  
