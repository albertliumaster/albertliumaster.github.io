- title: "An Exact Expression for Multidimensional Spectroscopy of a Spin-Boson Hamiltonian"
  image: AQTCover.png
  description: In open quantum systems, coupling between system and bath degrees of freedom are a primary source of quantum decoherence. Multidimensional coherent spectroscopy (MDCS) is a powerful technique capable of directly probing the spectral density of the system–bath coupling. To simplify modeling of MDCS of an open quantum system, we derive a compact, exact expression for multidimensional spectra of a spin-boson Hamiltonian.
  authors: A Liu
  link:
    url: https://doi.org/10.1002/qute.202300399
    display: Advanced Quantum Technologies 7, 3 (2024) - [pdf](/downloads/Liu_AQT_2024.pdf)
  highlight: 1
  
