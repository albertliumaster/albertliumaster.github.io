- title: "Probing Complex Decoherence Processes in Materials for Quantum Applications"
  image: 2025_APL.png
  description: In this perspective article, we introduce the principles of 2-D terahertz spectroscopy with a heuristic classical anharmonic oscillator model that provides intuition for the various nonlinearities observed in multidimensional spectra. We then outline the unique physics of quantum materials revealed by the specific nonlinearities. An outlook for multidimensional probes of non-equilibrium phases of quantum materials is also provided.
  authors: A Liu, MW Day, and ST Cundiff
  link:
    url: https://doi.org/10.1063/5.0275665
